plugins {
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        dataGen {
            mod(mod_id)
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

def devRecipeViewers = (findProperty('dev_recipe_viewers') ?: '')
        .split(',')
        .collect { it.trim().toLowerCase() }
        .findAll { !it.isEmpty() } as Set
def useDevRecipeViewer = { String id ->
    devRecipeViewers.contains('all') || devRecipeViewers.contains(id)
}

dependencies {
    forge "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    common(project(path: ':oresandstuff-common', configuration: 'namedElements')) {
        transitive = false
    }
    shadowCommon(project(path: ':oresandstuff-common', configuration: 'transformProductionForge')) {
        transitive = false
    }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") {
        transitive = false
    }
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") {
        transitive = false
    }
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}") {
        transitive = false
    }
    if (useDevRecipeViewer('jei')) {
        modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}") {
        transitive = false
    }
    modCompileOnly("me.shedaniel:RoughlyEnoughItems-default-plugin-forge:${rei_version}") {
        transitive = false
    }
    compileOnly("me.shedaniel.cloth:basic-math:0.6.1") {
        transitive = false
    }
    if (useDevRecipeViewer('rei')) {
        modRuntimeOnly("me.shedaniel:RoughlyEnoughItems-forge:${rei_version}")
    }
    modCompileOnly("dev.emi:emi-forge:${emi_version}:api") {
        transitive = false
    }
    if (useDevRecipeViewer('emi')) {
        modRuntimeOnly("dev.emi:emi-forge:${emi_version}")
    }
    modRuntimeOnly("io.github.llamalad7:mixinextras-forge:${mixinextras_version}") {
        transitive = false
    }
    forgeRuntimeLibrary("io.github.llamalad7:mixinextras-common:${mixinextras_version}") {
        transitive = false
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            ldlib_version          : ldlib_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'dev'
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

sourcesJar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    def commonSources = project(':oresandstuff-common').tasks.named('sourcesJar')
    dependsOn commonSources
    from commonSources.map { zipTree(it.archiveFile.get().asFile) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

tasks.named('runClient', JavaExec).configure {
    jvmArgs '-Xmx4G'
}
