pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.parchmentmc.org' }
        gradlePluginPortal()
    }
}

rootProject.name = 'Ores and Stuff'

include 'oresandstuff-common'
include 'oresandstuff-forge'
include 'oresandstuff-fabric'

project(':oresandstuff-common').projectDir = file('common')
project(':oresandstuff-forge').projectDir = file('forge')
project(':oresandstuff-fabric').projectDir = file('fabric')
